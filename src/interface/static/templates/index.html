<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >ADS Fault Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/shimano_logo.jpg') }}" alt="Testing" class="logo">
            </div>
            <div class="header-text">
                <h1>Shimano Singapore</h1>
                <h3>ADS Fault Monitoring Dashboard</h3>
            </div>
            <div class="user_info">
                <h1>Welcome {{ username }}!</h1>
                <h2>Current Camera : {{ description }}</h2>
            </div>
        </div>
        
        <nav class="navbar">
            <div class="nav-links">
                <a href="{{ url_for('index', camera_id=camera_id) }}">Home</a>
                <a href="{{ url_for('videos', camera_id=camera_id) }}">Recorded Videos</a>
                <a href="{{ url_for('incident_videos', camera_id=camera_id) }}">Incident Video</a>
                <a href="{{ url_for('settings_page', camera_id=camera_id) }}">Settings</a>
                <a href="{{ url_for('camera_list') }}">All Cameras</a> <!-- Assuming this page does not need camera_id -->
            </div>
        </nav> 
    </header>
    
    
    
    <div class="container">
        <h1 style="text-align: center; padding: 10px;" >{{ description }}</h1>
            <div class="stream-container">
                <div class="live-stream">
                    <img src="{{ url_for('video_feed', camera_id=camera_id) }}" alt="Video Feed" />                    <div class="status-circle" id="status-circle"></div>
                    <div id="status-message" class="status-message"></div>
                </div>
            </div>
    <div class="section-divider"></div> 
        <h2 style="text-align: center; padding-top: 15px;">Controls</h2>
            <div class="control-buttons">
                <form method="POST" action="{{ url_for('start_recording', camera_id=camera_id) }}" onsubmit="showRecordingStatus()">
                    <button type="submit" class="control-button green">Start Recording</button>
                </form>
                <form method="POST" action="{{ url_for('stop_recording', camera_id=camera_id) }}" onsubmit="hideStatus()">
                    <button type="submit" class="control-button orange">Stop Recording</button>
                </form>
                <form method="POST" action="{{ url_for('simulate_incident', camera_id=camera_id) }}" onsubmit="showIncidentStatus()">
                    <button type="submit" class="control-button red">Simulate Incident</button>
                </form>
            </div>
            <div class="section-divider"></div>

            

            <script>
                let incidentCount = 0;

                function showRecordingStatus() {
                const statusCircle = document.getElementById('status-circle');
                statusCircle.className = 'status-circle recording';
                document.getElementById('status-message').innerText = 'Recording...';
                }
                
                function hideStatus() {
                    const statusCircle = document.getElementById('status-circle');
                    statusCircle.className = 'status-circle';
                    document.getElementById('status-message').innerText = 'Recording stopped.';
                }
                
                function showIncidentStatus() {
                    const statusCircle = document.getElementById('status-circle');
                    statusCircle.className = 'status-circle incident';
                    incidentCount++;
                    document.getElementById('status-message').innerText = `Incident simulated. Count: ${incidentCount}`;
                    console.log('Incident status shown');
                }
            </script>
    </div>
</body>
</html>
