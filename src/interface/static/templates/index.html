<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >ADS Fault Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/shimano_logo.jpg') }}" alt="Testing" class="logo">
            </div>
            <div><h1>Shimano Singapore</h1></div>
            <div><h3 style="text-align: left; padding: 5px;"> ADS Fault Monitoring Dashboard </h3></div>
            <div class="user_info">
                {% if username %}
                    <h1>Welcome {{ username }}!</h1>
                {% else %}
                    <h1>You are not logged in.</h1>
                    <a href="/login">Login</a>
                {% endif %}
            </div>
        </div>
        
        <nav class="navbar">
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/videos">Recorded Videos</a>
                <a href="/incident_videos">Incident Video</a>
                <a href="/settings_page">Settings</a>
            </div>
        </div>  
    </header>
    
    
    
    <div class="container">
        <h2 style="text-align: center; padding: 10px;" >Camera 1</h2>
            <div class="stream-container">
                <div class="live-stream">
                    <img src="/video_feed" alt="Live Video Stream">
                    <div class="status-circle" id="status-circle"></div>
                    <div id="status-message" class="status-message"></div>
                </div>
            </div>
    <div class="section-divider"></div> 
        <h2 style="text-align: center; padding-top: 15px;">Controls</h2>
            <div class="control-buttons">
                <form method="POST" action="/start_recording" onsubmit="showRecordingStatus()">
                    <button type="submit" class="control-button green">Start Recording</button>
                </form>
                <form method="POST" action="/stop_recording" onsubmit="hideStatus()">
                    <button type="submit" class="control-button orange">Stop Recording</button>
                </form>
                <form method="POST" action="/simulate_incident" onsubmit="showIncidentStatus()">
                    <button type="submit" class="control-button red">Simulate Incident</button>
                </form>
            </div>
            <div class="section-divider"></div>

            

            <script>
                let incidentCount = 0;

                function showRecordingStatus() {
                const statusCircle = document.getElementById('status-circle');
                statusCircle.className = 'status-circle recording';
                document.getElementById('status-message').innerText = 'Recording...';
                }
                
                function hideStatus() {
                    const statusCircle = document.getElementById('status-circle');
                    statusCircle.className = 'status-circle';
                    document.getElementById('status-message').innerText = 'Recording stopped.';
                }
                
                function showIncidentStatus() {
                    const statusCircle = document.getElementById('status-circle');
                    statusCircle.className = 'status-circle incident';
                    incidentCount++;
                    document.getElementById('status-message').innerText = `Incident simulated. Count: ${incidentCount}`;
                    console.log('Incident status shown');
                }
            </script>
    </div>
</body>
</html>
