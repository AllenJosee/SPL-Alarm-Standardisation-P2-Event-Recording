<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >ADS Fault Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/shimano_logo.jpg') }}" alt="Testing" class="logo">
            </div>
            <div class="header-text">
                <h1>Shimano Singapore</h1>
                <h3>ADS Fault Monitoring Dashboard</h3>
            </div>
            <div class="user_info">
                <h1>Welcome {{ username }}!</h1>
                <h2>Current Camera : {{ description }}</h2>
            </div>
        </div>
        
        <nav class="navbar">
            <div class="nav-links">
                <a href="{{ url_for('index', camera_id=camera_id) }}">Home</a>
                <a href="{{ url_for('videos', camera_id=camera_id) }}">Recorded Videos</a>
                <a href="{{ url_for('incident_videos', camera_id=camera_id) }}">Incident Video</a>
                <a href="{{ url_for('settings_page', camera_id=camera_id) }}">Settings</a>
                <a href="{{ url_for('camera_list') }}">All Cameras</a> 
            </div>
        </nav> 
    </header>
    
    
    
    <div class="container">
        <h1 style="text-align: center; padding: 10px;" >{{ description }}</h1>
            <div class="stream-container">
                <div class="live-stream">
                    <div class="video-feed-container">
                        <div class="video-image-wrapper">
                            <img id="video-feed-img"
                                src="{{ url_for('video_feed', camera_id=camera_id) }}"
                                alt="Live feed for camera {{ camera_id }}"
                                onerror="handleFeedError()"
                                onload="handleFeedLoad()">
                       </div>
                       <div class="spinner" id="feed-spinner"></div>
                   </div>
                    </div>                    
                    <div class="status-circle" id="status-circle"></div>
                    <div id="status-message" class="status-message"> Status: Idle</div>
                </div>
            </div>
    <div class="section-divider"></div> 
        <h2 style="text-align: center; padding-top: 15px;">Controls</h2>
            <div class="control-buttons">
            <button type="button" class="control-button green" id="start-recording">Start Recording</button>
            <button type="button" class="control-button orange" id="stop-recording">Stop Recording</button>
            <form method="POST" action="{{ url_for('simulate_incident', camera_id=camera_id) }}" onsubmit="showIncidentStatus()">
                <button type="submit" class="control-button red">Simulate Incident</button>
            </form>
        </div>
            <div class="section-divider"></div>

            

            <script>
                let incidentCount = 0;
                const feedContainerForStatus = document.querySelector('.video-feed-container');

                function showRecordingStatus() {
                    // Keep status circle/message logic if you still use it
                    const statusCircle = document.getElementById('status-circle');
                    if (statusCircle) statusCircle.className = 'status-circle recording';
                    const statusMessage = document.getElementById('status-message');
                    if (statusMessage) statusMessage.innerText = 'Recording...';

                    // Add recording class to the CONTAINER for the border
                    if (feedContainerForStatus) {
                        feedContainerForStatus.classList.add('recording');
                    }
                }

                function hideStatus() { // Renamed from hideStatus for clarity if needed elsewhere, or keep as is
                    // Keep status circle/message logic if you still use it
                    const statusCircle = document.getElementById('status-circle');
                    if (statusCircle) statusCircle.className = 'status-circle';
                    const statusMessage = document.getElementById('status-message');
                    if (statusMessage) statusMessage.innerText = 'Recording stopped.'; // Or clear it

                    // Remove recording class from the CONTAINER
                    if (feedContainerForStatus) {
                        feedContainerForStatus.classList.remove('recording');
                    }
                }

                function showIncidentStatus() {
                    // Keep status circle/message logic if you still use it
                    const statusCircle = document.getElementById('status-circle');
                    if (statusCircle) statusCircle.className = 'status-circle incident';
                    incidentCount++;
                    const statusMessage = document.getElementById('status-message');
                    if (statusMessage) statusMessage.innerText = `Incident simulated. Count: ${incidentCount}`;
                    console.log('Incident status shown');
                    // Maybe remove recording border if incident stops recording?
                    // if (feedContainerForStatus) {
                    //    feedContainerForStatus.classList.remove('recording');
                    // }
        }
            </script>
            <script>
                const feedSpinner = document.getElementById('feed-spinner');
                const videoFeedImg = document.getElementById('video-feed-img');
                const feedContainer = document.querySelector('.video-feed-container');
        
                function handleFeedLoad() {
                    console.log("Video feed loaded (first frame). Hiding spinner.");
                    if (feedSpinner) {
                        feedSpinner.style.display = 'none';
                    }
                    if (videoFeedImg) {
                        videoFeedImg.style.display = 'block'; // *** Explicitly ensure image is displayed ***
                        videoFeedImg.classList.remove('error-state'); // Remove error class if re-loading after error
                    }
                    if (feedContainer) {
                        feedContainer.style.background = 'none';
                        // Keep padding-top if using that method
                        // feedContainer.style.minHeight = 'auto'; // Not needed with aspect ratio methods
                        feedContainer.classList.remove('error');
                    }
                }
        
                function handleFeedError() {
                    console.error("Error loading video feed. Hiding spinner.");
                    if (feedSpinner) {
                        feedSpinner.style.display = 'none';
                    }
                    if (videoFeedImg) {
                        videoFeedImg.style.display = 'none'; // Hide broken image
                        videoFeedImg.classList.add('error-state'); // Add error class
                    }
                if (feedContainer) {
                        feedContainer.classList.add('error');
                        // Ensure container keeps size on error if using padding-top
                        // feedContainer.style.paddingTop = '56.25%'; // Re-assert if needed
                }
                }

                // Initial check remains the same
                if (videoFeedImg.complete && videoFeedImg.naturalHeight !== 0) {
                    handleFeedLoad();
                } else if (videoFeedImg.complete) {
                handleFeedError(); // Treat complete but no height as error
                }
            </script>
            <script>
                document.getElementById('start-recording').addEventListener('click', function() {
                    fetch("{{ url_for('start_recording', camera_id=camera_id) }}", {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest' // Indicate that this is an AJAX request
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            showRecordingStatus();
                            console.log("Recording started successfully.");
                        } else {
                            console.error("Failed to start recording.");
                        }
                    })
                    .catch(error => console.error("Error starting recording:", error));
                });

                document.getElementById('stop-recording').addEventListener('click', function() {
                    fetch("{{ url_for('stop_recording', camera_id=camera_id) }}", {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest' // Indicate that this is an AJAX request
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            hideStatus();
                            console.log("Recording stopped successfully.");
                        } else {
                            console.error("Failed to stop recording.");
                        }
                    })
                    .catch(error => console.error("Error stopping recording:", error));
                });
            </script>
            <script>
                window.onload = function() {
                    const recordingStatus = "{{ recording_status }}";  // Get status from Flask
                    if (recordingStatus === 'recording') {
                        showRecordingStatus();
                    } else if (recordingStatus === 'stopped') {
                        hideStatus();
                    }
                };
            </script>


    </div>
</body>
</html>
